<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes System Design</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p id="status" class="status-message" aria-live="polite"></p>
    </header>

    <main>
        <section class="controls">
            <button id="load-btn">Load Notes from Server</button>
        </section>

        <section class="create-note">
            <h2>Create New Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Title (Required, Max 100 chars)</label>
                    <input type="text" id="title-input" maxlength="100" required />
                </div>
                <div class="form-group">
                    <label for="body-input">Body (Optional)</label>
                    <textarea id="body-input" rows="4"></textarea>
                </div>
                <button type="submit" id="submit-btn">Create Note</button>
            </form>
        </section>

        <section class="notes-section">
            <h2>Your Notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
